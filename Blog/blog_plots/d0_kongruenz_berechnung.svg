<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Kongruenzwert - Infografik</title>
  <desc id="desc">Reduzierte Infografik mit 50-Prozent-Schwelle und Plus-Minus-Matrix.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d7deea; stroke-width: 2; rx: 14; ry: 14; }
      .left { fill: #fdeeee; }
      .right { fill: #eaf8ee; }
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #1f2a36; }
      .h { font: 700 24px Arial, Helvetica, sans-serif; fill: #1f2a36; }
      .t { font: 600 20px Arial, Helvetica, sans-serif; fill: #32485f; }
      .s { font: 600 18px Arial, Helvetica, sans-serif; fill: #60758c; }
      .axis { stroke: #32485f; stroke-width: 4; }
      .tick { stroke: #32485f; stroke-width: 3; }
      .grid { stroke: #d7deea; stroke-width: 2; }
      .plus { font: 700 56px Arial, Helvetica, sans-serif; fill: #1f8f4d; }
      .minus { font: 700 56px Arial, Helvetica, sans-serif; fill: #c0392b; }
      .formula { font: 700 26px "Courier New", Courier, monospace; fill: #1f2a36; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="860"/>

  <!-- Top: Wertebereich -->
  <rect class="card left" x="120" y="100" width="580" height="170"/>
  <rect class="card right" x="700" y="100" width="580" height="170"/>
  <line class="axis" x1="170" y1="195" x2="1230" y2="195"/>
  <line class="tick" x1="170" y1="183" x2="170" y2="207"/>
  <line class="tick" x1="700" y1="176" x2="700" y2="214"/>
  <line class="tick" x1="1230" y1="183" x2="1230" y2="207"/>
  <text class="t" x="410" y="152" text-anchor="middle">Nein-Mehrheit</text>
  <text class="t" x="990" y="152" text-anchor="middle">Ja-Mehrheit</text>
  <text class="h" x="700" y="248" text-anchor="middle">0</text>
  <text class="s" x="170" y="238" text-anchor="middle">-0.5</text>
  <text class="s" x="1230" y="238" text-anchor="middle">+0.5</text>

  <!-- Matrix -->
  <rect class="card" x="120" y="310" width="1160" height="450"/>
  <text class="h" x="700" y="350" text-anchor="middle">Vorzeichen von K</text>

  <!-- Grid -->
  <line class="grid" x1="320" y1="380" x2="320" y2="730"/>
  <line class="grid" x1="800" y1="380" x2="800" y2="730"/>
  <line class="grid" x1="120" y1="450" x2="1280" y2="450"/>
  <line class="grid" x1="120" y1="590" x2="1280" y2="590"/>

  <!-- Headers -->
  <text class="t" x="220" y="425" text-anchor="middle">Empfehlung</text>
  <text class="t" x="560" y="425" text-anchor="middle">Volk: Nein-Mehrheit (&lt;50%)</text>
  <text class="t" x="1040" y="425" text-anchor="middle">Volk: Ja-Mehrheit (&gt;50%)</text>

  <!-- Row labels -->
  <text class="t" x="220" y="525" text-anchor="middle">Ja</text>
  <text class="t" x="220" y="665" text-anchor="middle">Nein</text>

  <!-- Signs -->
  <text class="minus" x="560" y="545" text-anchor="middle">-</text>
  <text class="plus" x="1040" y="545" text-anchor="middle">+</text>
  <text class="plus" x="560" y="685" text-anchor="middle">+</text>
  <text class="minus" x="1040" y="685" text-anchor="middle">-</text>

</svg>
