title: "Prädiktive Direkte Demokratie"
description: "Kongruenz zwischen Abstimmungsempfehlungen und Volksentscheid"

# GitHub Pages setzt url/baseurl beim Build (configure-pages).
# Für lokale Vorschau: bundle exec jekyll serve --baseurl "/democracy-challenge"
url: "https://bimdoer.github.io"
baseurl: "/democracy-challenge"

markdown: kramdown
kramdown:
  input: GFM
  # false: <details>, text-reihe etc. nicht in <p> zerlegen; Markdown nur in divs mit markdown="1"
  parse_block_html: false
  auto_ids: true
  auto_id_stripping: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

include:
  - blog_plots
  - markdown_layout
  - assets

exclude:
  - old files
